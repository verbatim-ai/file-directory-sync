[project]
name = "verbatim-file-directory-sync"
version = "0.1.0"
description = "Sync a local directory tree into a Verbatim AI corpus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Verbatim AI" }]
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
verbatim-sync = "verbatim_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verbatim_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["verbatim_sync"]
# __main__ is covered by a subprocess, which the parent process cannot measure.
omit = ["*/verbatim_sync/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
